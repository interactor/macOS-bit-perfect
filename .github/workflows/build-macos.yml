name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Quality.xcodeproj \
            -scheme LosslessSwitcher \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release/LosslessSwitcher.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" LosslessSwitcher.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LosslessSwitcher-macos
          path: LosslessSwitcher.zip
